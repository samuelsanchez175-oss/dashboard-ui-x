<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f8a4c" />
  <title>CDL TEST PREP 2027 — App Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #1f8a4c;
      --accent-deep: #14622f;
      --ink: #15281c;
      --ink-soft: #4a5b50;
      --paper: #f6f4ec;
      --card: #fff;
      --border: #dde2d3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(900px 480px at 50% -10%, #d7ecd9 0%, var(--paper) 55%);
      color: var(--ink);
      line-height: 1.5;
      padding: 36px 20px 140px;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }
    .icon {
      width: 88px; height: 88px; border-radius: 22px;
      display: block; margin: 0 auto 16px;
      box-shadow: 0 10px 24px rgba(20, 98, 47, .22);
      object-fit: cover;
    }
    h1 { font-size: 24px; letter-spacing: -.02em; }
    .sub { margin: 10px 0 22px; color: var(--ink-soft); font-size: 15px; }
    .go {
      display: inline-block;
      background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 700;
      padding: 14px 22px; border-radius: 14px;
    }
    .status { margin-top: 14px; font-size: 13px; color: var(--ink-soft); }

    .banner {
      position: fixed; left: 12px; right: 12px; bottom: 12px;
      z-index: 20;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 10px 32px rgba(20, 40, 28, .16);
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .banner p { flex: 1 1 180px; font-size: 13px; color: var(--ink-soft); margin: 0; }
    .banner p a { color: var(--accent-deep); }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    .actions button {
      font: inherit; font-weight: 700; font-size: 13px;
      border-radius: 10px; padding: 8px 14px; cursor: pointer;
    }
    .decline {
      background: transparent; border: 1px solid var(--border); color: var(--ink);
    }
    .accept {
      background: var(--accent); border: 0; color: #fff;
    }
    .banner[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/cdl-qr-truck.png" alt="" />
    <h1>CDL TEST PREP 2027</h1>
    <p class="sub" id="sub">Taking you to the App Store…</p>
    <a class="go" id="store" href="https://apps.apple.com/us/app/cdl-test-prep-2027/id6782784591">Get the app</a>
    <p class="status" id="status"></p>
  </main>

  <div class="banner" id="banner" role="dialog" aria-label="Optional scan info">
    <p>
      Optional: share location so we can see which flyer you scanned.
      <a href="/harmony/cdl-privacy.html">Privacy</a>
      ·
      <a href="/harmony/cdl-terms.html">Terms</a>
    </p>
    <div class="actions">
      <button type="button" class="decline" id="decline">Decline</button>
      <button type="button" class="accept" id="accept">Accept</button>
    </div>
  </div>

  <script>
    const DEFAULT_STORE = "https://apps.apple.com/us/app/cdl-test-prep-2027/id6782784591";
    const params = new URLSearchParams(location.search);
    const scanId = Number(params.get("id") || "");
    function destFromQuery() {
      const raw = params.get("to");
      if (!raw) return DEFAULT_STORE;
      try {
        const u = new URL(raw);
        if (u.protocol === "http:" || u.protocol === "https:") return u.toString();
      } catch (_) { /* keep default */ }
      return DEFAULT_STORE;
    }
    const STORE = destFromQuery();
    const storeLink = document.getElementById("store");
    if (storeLink) storeLink.setAttribute("href", STORE);
    const banner = document.getElementById("banner");
    const status = document.getElementById("status");
    let hopping = false;

    const hopTimer = setTimeout(() => hopToStore({ termsAccepted: false, locationGranted: false }), 2500);

    function readLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) {
          resolve({ granted: false });
          return;
        }
        const timer = setTimeout(() => resolve({ granted: false }), 5000);
        navigator.geolocation.getCurrentPosition(
          pos => {
            clearTimeout(timer);
            resolve({ granted: true, lat: pos.coords.latitude, lon: pos.coords.longitude });
          },
          () => {
            clearTimeout(timer);
            resolve({ granted: false });
          },
          { enableHighAccuracy: false, timeout: 4000, maximumAge: 60000 }
        );
      });
    }

    async function hopToStore(payload) {
      if (hopping) return;
      hopping = true;
      clearTimeout(hopTimer);
      banner.hidden = true;
      status.textContent = "Opening the App Store…";
      try {
        await fetch("/api/cdl-qr/consent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: Number.isFinite(scanId) ? scanId : null,
            ...payload,
          }),
        });
      } catch (_) { /* still go */ }
      location.href = STORE;
    }

    document.getElementById("decline").addEventListener("click", () => {
      hopToStore({ termsAccepted: false, locationGranted: false });
    });

    document.getElementById("accept").addEventListener("click", async () => {
      clearTimeout(hopTimer);
      hopping = false;
      status.textContent = "Saving…";
      const loc = await readLocation();
      hopToStore({
        termsAccepted: true,
        locationGranted: !!loc.granted,
        lat: loc.lat ?? null,
        lon: loc.lon ?? null,
      });
    });

    document.getElementById("store").addEventListener("click", () => {
      clearTimeout(hopTimer);
      banner.hidden = true;
    });
  </script>
</body>
</html>
