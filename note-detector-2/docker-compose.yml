# docker-compose.yml — local-dev stack for note-detector-2.
# Three services share one image (Dockerfile in this dir):
#   - redis   : broker + result backend for Celery
#   - api     : FastAPI / uvicorn (request surface)
#   - worker  : Celery worker (heavy ML pipeline)
#
# All three mount ./app so code edits hot-reload (uvicorn) / take effect on the
# next task (worker — Celery does not hot-reload mid-task).

services:
  redis:
    image: redis:7-alpine
    container_name: nd2-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: nd2-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the defaults from .env so service hostnames are correct inside the compose network.
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./app:/code/app
      - ./storage:/code/storage
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: nd2-worker
    # One concurrent task per worker process — Demucs + Omnizart hold a lot of state.
    # Crank concurrency by adding replicas instead of threads.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Cache model downloads in a host-mounted volume so rebuilds don't re-pull ~2 GB of checkpoints.
      TORCH_HOME: /code/models/torch
      OMNIZART_CHECKPOINTS: /code/models/omnizart
      HF_HOME: /code/models/hf
    volumes:
      - ./app:/code/app
      - ./storage:/code/storage
      - ./models:/code/models
    depends_on:
      redis:
        condition: service_healthy
